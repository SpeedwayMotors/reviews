name: Validate and deploy exact-link reviews

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out compiled reviews
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate exact-link boundaries
        run: bash .github/scripts/validate-review-repository.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package validated review site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy validated review site
        id: deployment
        uses: actions/deploy-pages@v5
